name: build-exe

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch: {}

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name T58-Prop-Algo-Backtester `
            --add-data "data/examples;data/examples" `
            app/main.py

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: T58-Prop-Algo-Backtester-windows-exe
          path: dist/T58-Prop-Algo-Backtester.exe

      - name: Attach .exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/T58-Prop-Algo-Backtester.exe

name: deploy-firebase

# Builds this repo's web app into a container, deploys it to Cloud Run, then
# points Firebase Hosting at that Cloud Run service (see firebase.json).
# End result: pushing to main updates the live PWA at your Firebase Hosting
# URL automatically.
#
# ONE-TIME SETUP (see FIREBASE_DEPLOY.md for the full walkthrough):
#   1. Create a Firebase project (same as a GCP project) at
#      https://console.firebase.google.com, note its Project ID.
#   2. Put that Project ID in .firebaserc (replacing the placeholder) AND
#      as the GCP_PROJECT_ID repo secret below.
#   3. Create a GCP service account with the "Cloud Run Admin",
#      "Service Account User", "Artifact Registry Writer", and
#      "Firebase Hosting Admin" roles, and add its JSON key as the
#      GCP_SA_KEY repo secret (Settings -> Secrets and variables -> Actions
#      -> New repository secret). The same key authenticates both the
#      gcloud/Cloud Run steps and the Firebase Hosting deploy below --
#      no separate Firebase CI token needed.
#   4. Enable the Cloud Run API and Artifact Registry API on the GCP project
#      (console will prompt you the first time, or `gcloud services enable
#      run.googleapis.com artifactregistry.googleapis.com`).

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  REGION: us-central1
  SERVICE: t58-backtester

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: "${{ secrets.GCP_PROJECT_ID }}"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry repo exists
        run: |
          gcloud artifacts repositories describe t58-images \
            --location=${{ env.REGION }} \
            || gcloud artifacts repositories create t58-images \
                 --repository-format=docker \
                 --location=${{ env.REGION }} \
                 --description="T58 Prop Algo Backtester container images"

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/t58-images/${{ env.SERVICE }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image="${{ env.IMAGE }}" \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=1 \
            --max-instances=1 \
            --memory=1Gi \
            --cpu=1 \
            --timeout=900 \
            --concurrency=4

      - name: Set up Node (for firebase-tools)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "${{ steps.auth.outputs.credentials_file_path }}"
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project ${{ secrets.GCP_PROJECT_ID }} --non-interactive
